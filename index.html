<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burning Candle Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a1a2e, #0f0f1e);
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff8555;
        }
        button.active {
            background: #4ecdc4;
        }
    </style>
</head>
<body>
    <div id="info">
        <p>ID: {{INSTANCE_ID}}</p>
        <strong>Burning Candle Simulation</strong><br>
        Drag to rotate • Scroll to zoom<br>
        Time: <span id="time">0</span>s
    </div>
    <div id="controls">
        
        <button id="toggleBtn" class="active">Pause</button>
        <button id="resetBtn">Reset</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, candle, wick, flame, wax;
        let particles = [];
        let meltLevel = 0;
        let burning = true;
        let time = 0;
        const BURN_RATE = 0.3;
        const MELT_RATE = 0.15;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff6600, 2, 50);
            pointLight.position.set(0, 2, 0);
            pointLight.castShadow = true;
            scene.add(pointLight);

            createCandle();
            createFlame();
            setupMouseControls();
            
            document.getElementById('toggleBtn').addEventListener('click', toggleBurning);
            document.getElementById('resetBtn').addEventListener('click', reset);

            animate();
        }

        function createCandle() {
            const candleGroup = new THREE.Group();

            const candleGeom = new THREE.CylinderGeometry(0.5, 0.5, 3, 32);
            const candleMat = new THREE.MeshPhongMaterial({ 
                color: 0xffeedd,
                shininess: 10
            });
            candle = new THREE.Mesh(candleGeom, candleMat);
            candle.position.y = 0;
            candle.castShadow = true;
            candle.receiveShadow = true;
            candleGroup.add(candle);

            const wickGeom = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8);
            const wickMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
            wick = new THREE.Mesh(wickGeom, wickMat);
            wick.position.y = 1.75;
            candleGroup.add(wick);

            const waxGeom = new THREE.CylinderGeometry(0.52, 0.48, 0.1, 32);
            const waxMat = new THREE.MeshPhongMaterial({ 
                color: 0xffddcc,
                transparent: true,
                opacity: 0.6
            });
            wax = new THREE.Mesh(waxGeom, waxMat);
            wax.position.y = 1.5;
            wax.visible = false;
            candleGroup.add(wax);

            scene.add(candleGroup);
        }

        function createFlame() {
            const flameGroup = new THREE.Group();
            
            const flameGeom = new THREE.SphereGeometry(0.15, 16, 16);
            flameGeom.scale(1, 1.5, 1);
            
            const innerFlame = new THREE.Mesh(
                flameGeom,
                new THREE.MeshBasicMaterial({ 
                    color: 0xffff99,
                    transparent: true,
                    opacity: 0.9
                })
            );
            flameGroup.add(innerFlame);

            const outerFlame = new THREE.Mesh(
                flameGeom.clone(),
                new THREE.MeshBasicMaterial({ 
                    color: 0xff6600,
                    transparent: true,
                    opacity: 0.5
                })
            );
            outerFlame.scale.set(1.3, 1.3, 1.3);
            flameGroup.add(outerFlame);

            const glowGeom = new THREE.SphereGeometry(0.3, 16, 16);
            const glow = new THREE.Mesh(
                glowGeom,
                new THREE.MeshBasicMaterial({ 
                    color: 0xff8800,
                    transparent: true,
                    opacity: 0.2
                })
            );
            flameGroup.add(glow);

            flameGroup.position.y = 2.1;
            flame = flameGroup;
            scene.add(flame);
        }

        function createSmokeParticle() {
            const geom = new THREE.SphereGeometry(0.05, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ 
                color: 0x888888,
                transparent: true,
                opacity: 0.3
            });
            const particle = new THREE.Mesh(geom, mat);
            particle.position.set(
                flame.position.x + (Math.random() - 0.5) * 0.1,
                flame.position.y + 0.2,
                flame.position.z + (Math.random() - 0.5) * 0.1
            );
            particle.velocity = {
                x: (Math.random() - 0.5) * 0.02,
                y: 0.02 + Math.random() * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };
            particle.life = 1.0;
            scene.add(particle);
            particles.push(particle);
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.x += p.velocity.x;
                p.position.y += p.velocity.y;
                p.position.z += p.velocity.z;
                p.life -= 0.01;
                p.material.opacity = p.life * 0.3;
                p.scale.set(1 + (1 - p.life), 1 + (1 - p.life), 1 + (1 - p.life));

                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function updateCandle() {
            if (!burning) return;

            time += 0.016;
            document.getElementById('time').textContent = time.toFixed(1);

            meltLevel += MELT_RATE * 0.016;
            
            const meltAmount = Math.min(meltLevel * 0.1, 1.2);
            candle.scale.y = 1 - meltAmount * 0.4;
            candle.position.y = -meltAmount * 0.6;
            
            wick.position.y = 1.75 - meltAmount * 0.6;
            flame.position.y = 2.1 - meltAmount * 0.6;

            if (meltLevel > 3) {
                wax.visible = true;
                wax.position.y = 1.5 - meltAmount * 0.3;
                wax.scale.y = 1 + meltLevel * 0.05;
            }

            flame.rotation.z = Math.sin(Date.now() * 0.01) * 0.1;
            flame.children[0].scale.y = 1.5 + Math.sin(Date.now() * 0.005) * 0.1;
            flame.children[1].scale.set(
                1.3 + Math.sin(Date.now() * 0.003) * 0.1,
                1.3 + Math.cos(Date.now() * 0.004) * 0.1,
                1.3
            );

            if (Math.random() < 0.3) {
                createSmokeParticle();
            }
        }

        function setupMouseControls() {
            let isDragging = false;
            let prevX = 0;
            let prevY = 0;

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevX = e.clientX;
                prevY = e.clientY;
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - prevX;
                const deltaY = e.clientY - prevY;
                scene.rotation.y += deltaX * 0.01;
                scene.rotation.x += deltaY * 0.01;
                prevX = e.clientX;
                prevY = e.clientY;
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });

            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(2, Math.min(10, camera.position.z));
            });
        }

        function toggleBurning() {
            burning = !burning;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = burning ? 'Pause' : 'Resume';
            btn.className = burning ? 'active' : '';
            flame.visible = burning;
        }

        function reset() {
            meltLevel = 0;
            time = 0;
            burning = true;
            document.getElementById('toggleBtn').textContent = 'Pause';
            document.getElementById('toggleBtn').className = 'active';
            
            candle.scale.y = 1;
            candle.position.y = 0;
            wick.position.y = 1.75;
            flame.position.y = 2.1;
            flame.visible = true;
            wax.visible = false;
            
            particles.forEach(p => scene.remove(p));
            particles = [];
        }

        function animate() {
            requestAnimationFrame(animate);
            updateCandle();
            updateParticles();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
